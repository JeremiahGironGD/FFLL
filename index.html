<html lang="en">
<head>

    <!-- For the Mobile App, does nothing on main page -->
    <script>window.ffllAppPage = true;</script> 
     <script src="js/updateChecker.js"></script>
    </head>
    <body>
        <!-- Website Contents(Uses CSS code from the Head) -->
        <main>
            <h1 data-i18n="pageTitle">Family and Friends Challenge List</h1>
            <h4 data-i18n="subtitle">Level placements are decided by JeremiahGironGD (Idekan)</h4>
            <div class="site-header">
                <div class="brand" data-i18n="brand">FFLL</div>
                <nav class="nav-links" aria-label="Top navigation">
                    <a class="nav-item" href="points.html">
                        <span class="nav-item-label" data-i18n="pointsLabel">Points</span>
                        <span class="nav-item-title" data-i18n="pointsTitle">Points System</span>
                    </a>
                    <a class="nav-item" href="list2.html">
                        <span class="nav-item-label" data-i18n="decorationsLabel">Decorations</span>
                        <span class="nav-item-title" data-i18n="decorationsTitle">Decoration List</span>
                    </a>
                    <a class="nav-item" href="rules.html">
                        <span class="nav-item-label" data-i18n="rulesLabel">Rules</span>
                        <span class="nav-item-title demonlist" data-i18n="rulesTitle">Level Rules (WIP)</span>
                    </a>
                    <a class="nav-item" href="moreinfo.html">
                        <span class="nav-item-label" data-i18n="infoLabel">Info</span>
                        <span class="nav-item-title" data-i18n="infoTitle">More Info (WIP)</span>
                    </a>
                    <a class="nav-item" href="https://github.com/JeremiahGironGD/FFLL/issues" target="_blank" rel="noopener noreferrer">
                        <span class="nav-item-label" data-i18n="githubLabel">Issues</span>
                        <span class="nav-item-title" data-i18n="githubTitle">Report a Bug</span>
                    </a>
                    <a class="nav-item" href="https://github.com/JeremiahGironGD/FFLL/releases" target="_blank" rel="noopener noreferrer">
                        <span class="nav-item-label" data-i18n="releasesLabel">Download</span>
                        <span class="nav-item-title" data-i18n="releasesTitle">Download the App(Mobile)</span>
                    </a>
                </nav>
                <button type="button" id="locale-switch" class="locale-switch" aria-label="Toggle language">
                    <span class="locale-flag" id="locale-flag">🇺🇸</span>
                    <span id="locale-label">EN</span>
                </button>
            </div>
            <h3 data-i18n="levelsText">Levels:</h3>
            <div class="card-list" id="level-list"></div>
        </main>
        <script>
            const FFLL_LOCALE_KEY = 'ffll-locale';
            const pageTranslations = {
                en: {
                    localeFlag: '🇺🇸',
                    localeLabel: 'EN',
                    brand: 'FFLL',
                    pointsLabel: 'Points',
                    pointsTitle: 'Points System',
                    decorationsLabel: 'Decorations',
                    decorationsTitle: 'Decoration List',
                    rulesLabel: 'Rules',
                    rulesTitle: 'Level Rules (WIP)',
                    infoLabel: 'Info',
                    infoTitle: 'More Info (WIP)',
                    pageTitle: 'Family and Friends Challenge List',
                    subtitle: 'Level placements are decided by JeremiahGironGD (Idekan)',
                    levelsText: 'Levels:',
                    githubLabel: 'Issues',
                    githubTitle: 'Report a Bug',
                    releasesLabel: 'Download',
                    releasesTitle: 'Download the App(Mobile)'
                },
                es: {
                    localeFlag: '🇪🇸',
                    localeLabel: 'ES',
                    brand: 'FFLL',
                    pointsLabel: 'Puntos',
                    pointsTitle: 'Sistema de Puntos',
                    decorationsLabel: 'Decoraciones',
                    decorationsTitle: 'Lista de Decoración',
                    rulesLabel: 'Reglas',
                    rulesTitle: 'Reglas del Nivel (WIP)',
                    infoLabel: 'Info',
                    infoTitle: 'Más Información (WIP)',
                    pageTitle: 'Lista de Desafíos Familia y Amigos',
                    subtitle: 'Las posiciones de nivel las decide JeremiahGironGD (Idekan)',
                    levelsText: 'Niveles:',
                    githubLabel: 'Asuntos',
                    githubTitle: 'Informar de un error',
                    releasesLabel: 'Descargar',
                    releasesTitle: 'Descargar la App(Móvil)'
                }
            };

            function getSavedLocale() {
                return localStorage.getItem(FFLL_LOCALE_KEY) || 'en';
            }

            function saveLocale(locale) {
                localStorage.setItem(FFLL_LOCALE_KEY, locale);
            }

            let __ffllSpanishAlertShown = false;

            function updateLocaleElements(locale) {
                const map = pageTranslations[locale] || pageTranslations.en;
                document.documentElement.lang = locale === 'es' ? 'es' : 'en';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (!key || typeof map[key] === 'undefined') return;
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.setAttribute('placeholder', map[key]);
                    } else {
                        el.textContent = map[key];
                    }
                });
                const flag = document.getElementById('locale-flag');
                const label = document.getElementById('locale-label');
                if (flag) flag.textContent = map.localeFlag;
                if (label) label.textContent = map.localeLabel;
                if (locale === 'es' && !__ffllSpanishAlertShown) {
                    alert('Spanish is not yet finished, proceed | El español aún no ha terminado, ¿proceder?');
                    __ffllSpanishAlertShown = true;
                }
            }

            function initLocaleToggle() {
                const locale = getSavedLocale();
                updateLocaleElements(locale);
                const switchEl = document.getElementById('locale-switch');
                if (!switchEl) return;
                switchEl.addEventListener('click', () => {
                    const next = getSavedLocale() === 'en' ? 'es' : 'en';
                    saveLocale(next);
                    updateLocaleElements(next);
                });
            }

            initLocaleToggle();
    </script>
    <script>
            const REDIRECT_URL = "redirect.html?how";
            const POLL_INTERVAL_MS = 500;
            const allowBack = new URLSearchParams(window.location.search).get('allowBack') === '1';
            function kickUser() {
                window.location.href = REDIRECT_URL;
            }

            function detectDevTools() {
                if (typeof window.devtools === 'object' && window.devtools?.isOpen) {
                    return true;
                }

                const widthDiff = Math.abs(window.outerWidth - window.innerWidth);
                const heightDiff = Math.abs(window.outerHeight - window.innerHeight);
                if (widthDiff > 160 || heightDiff > 160) {
                    return true;
                }

                let open = false;
                const detector = new Image();
                Object.defineProperty(detector, 'id', {
                    get() {
                        open = true;
                        return '';
                    }
                });
                console.log('%c', detector);
                return open;
            }

            function checkDevTools() {
                if (allowBack) return;
                if (detectDevTools()) {
                    kickUser();
                }
            }

            if (!allowBack) {
                checkDevTools();
                window.addEventListener('resize', checkDevTools);
                window.addEventListener('keydown', event => {
                const key = event.key?.toLowerCase();
                if (key === 'f12' || ((event.ctrlKey || event.metaKey) && event.shiftKey && key === 'i')) {
                    kickUser();
                }
            });
            setInterval(checkDevTools, POLL_INTERVAL_MS);
            }
        </script>
        <script type="module" src="assets/runbuilder.js"></script>
    </body>
</html>
