<html lang="en">
<head>
    <mtea charset="UTC4">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFLL - More Info</title>
    <link rel="icon" type="image/x-icon" href="Favicon.ico">
    </head>
    <style>
         :root {
            color-scheme: dark;
            --bg: #110917;
            --surface: rgba(28, 16, 35, 0.9);
            --surface-strong: rgba(42, 24, 58, 0.95);
            --border: rgba(255, 255, 255, 0.12);
            --text: #eef3ff;
            --muted: #c3cad9;
            --accent: #b86af2;
            --accent-soft: #8c5eea;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            height: 100%;
            overscroll-behavior-y: none;
        }

        html {
            background: transparent;
        }
        
        /* The body, controls the background and the animation */
        body {
            background: radial-gradient(circle at top right, rgba(192, 145, 255, 0.16), transparent 28%),
                        radial-gradient(circle at bottom left, rgba(255, 94, 202, 0.12), transparent 24%);
            background-attachment: fixed;
            
            animation: pulse 12s ease-in-out infinite;
            
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        main {
            width: min(720px, 100%);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 3vw, 2.6rem);
            letter-spacing: -0.03em;
        }

        h4 {
            margin: 0 0 24px;
            color: var(--muted);
            font-weight: 500;
        }

        h3 {
            margin: 0 0 16px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: 0.95rem;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 0 0 32px;
            padding: 18px 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
        }

        .brand {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #eef3ff;
            font-family: Inter, system-ui, sans-serif;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }

        .nav-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-decoration: none;
            color: var(--text);
            text-align: center;
            transition: transform 180ms ease, color 180ms ease;
        }

        .nav-item:hover {
            transform: translateY(-1px);
            color: #ffffff;
        }

        .nav-item-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--muted);
        }

        .nav-item-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f7f4ff;
            white-space: nowrap;
        }

        .nav-item-title.list::after {
            content: '▼';
            margin-left: 6px;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .locale-switch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: background 180ms ease, transform 180ms ease;
        }

        .locale-switch:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }

        .locale-flag {
            font-size: 1rem;
        }

        .card-list {
            display: grid;
            gap: 16px;
        }

        .level-card {
            display: block;
            position: relative;
            padding: 18px 22px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(46, 24, 70, 0.96), rgba(20, 10, 26, 0.94));
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
            overflow: hidden;
        }

        .level-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(184, 106, 242, 0.16), transparent 34%),
                        radial-gradient(circle at bottom right, rgba(99, 179, 255, 0.1), transparent 30%);
            pointer-events: none;
        }

        .level-card .points-label {
            position: absolute;
            right: 18px;
            bottom: 16px;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: rgba(227, 231, 242, 0.95);
            font-size: 0.82rem;
            line-height: 1.2;
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(12, 12, 22, 0.75);
            white-space: nowrap;
            pointer-events: none;
        }

        .level-card::after {
            content: "";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
            opacity: 0.7;
        }

        .level-card span {
            position: relative;
            display: block;
            z-index: 1;
        }

        .level-card .label {
            font-size: 0.95rem;
            color: var(--accent);
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .level-card .title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f9f7ff;
        }

        .level-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 26px 55px rgba(0, 0, 0, 0.32);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .level-card:hover .title {
            color: #ffffff;
        }

                .level-card.gold {
                    background: linear-gradient(
                        90deg, 
                        #3e2d15 0%, 
                        #6d561b 35%,  
                        #a98942 50%,
                        #6d561b 65%, 
                        #3e2d15 100%
                    );
                    background-size: 200% auto;
                    animation: goldShine 4s linear infinite;
                }

                /* Animation for the gold level card */
                /* Idk what to say about this one */
                @keyframes goldShine {
                    0% {
                        background-position: 200% center;
                    }
                    100% {
                        background-position: -200% center;
                    }
                }

        .level-card.silver {
            background: linear-gradient(135deg, #2a2b37 0%, #5d6572 100%);
        }

        .level-card.bronze {
            background: linear-gradient(135deg, #3a2117 0%, #7d5037 100%);
        }

        .level-card.dark {
            background: linear-gradient(135deg, #171717 0%, #312b3d 100%);
        }

        @keyframes pulse {
            0% {
                background-color: #120613; 
            }
            25% {
                background-color: #150d3072; 
            }
            50% {
                background-color: #120613; 
            }
            75% {
                background-color: #150d3072; 
            }
            100% {
                background-color: #120613; 
            }
        }
        .card-list { display: grid; gap: 20px; }
        .info-card, .video-card {
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        }   
        .info-card h2, .video-card h2 { margin: 0 0 16px; color: #fff; }
        .info-row { display: grid; gap: 12px; }
        .info-item { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); }
        .info-item span { color: var(--muted); }
        .info-item strong { color: #fff; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.4;
        }
    </style>
<body>

    <h3>The challenge list for all my friends & Family!</h3>
    <h4>In Progress!</h4>
    <a class="back-link" href="index.html">← Back to levels</a>
    <main>
        <section class="info-card">
            <div class="info-row">
                <h2 class="info-item">The FFLL Team</h2>
                <div class="info-item">The FFLL team constists of only me and my friend I usually do most of the coding tho -Idekan</div>
            </div>
        </section>
    </main>
    </body>
</html>
