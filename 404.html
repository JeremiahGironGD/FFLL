<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FFLL - 404 Not Found</title>
        <link rel="icon" type="image/x-icon" href="Favicon.ico">
        <style>
            html, body {
                width: 100%;
                min-height: 100%;
                height: 100%;
                background-color: #4c0c57;
                overscroll-behavior-y: none;
            }
            html {
                background: transparent;
            }
            body {
                background: radial-gradient(circle at top right, rgba(0, 0, 0, 0.16), transparent 28%),
                radial-gradient(circle at bottom left, rgba(184, 10, 10, 0.501), transparent 24%),
                linear-gradient(180deg, #000000 0%, #100511 100%);
                background-attachment: fixed;
                margin: 0;
                min-height: 100vh;
                font-family: Inter, system-ui, sans-serif;
                color: var(--text);
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 32px 16px;
            }
            main {
                display: flex;
                align-items: center;
                justify-content: center;
                width: min(880px, 100%);
                min-height: 100vh;
            }
            .container {
                width: min(760px, 100%);
                max-width: 760px;
                background: linear-gradient(135deg, rgba(135, 6, 6, 0.92), rgba(20, 10, 26, 0.96));
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 28px;
                padding: 42px 46px;
                box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
            }
            h1 {
                font-size: clamp(3rem, 5vw, 4.6rem);
                margin-bottom: 24px;
                letter-spacing: -0.04em;
            }
            p {
                font-size: 1.2rem;
                color: #c8ccd8;
                margin-bottom: 22px;
                line-height: 1.8;
            }
            a {
                display: inline-block;
                font-size: 1rem;
                color: #69b8ff;
                text-decoration: none;
                font-weight: 700;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
    <main>
        <div class="container">
            <h1>404 Not Found</h1>
            <p>The page you are looking for does not exist.</p>
            <a href="index.html?allowBack=1">Go back to the main page</a>
        </div>
    </main> 
    </body>
</html>
