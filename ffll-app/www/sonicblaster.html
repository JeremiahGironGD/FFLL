<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Blaster - FFLL</title>
    <link rel="icon" type="image/x-icon" href="Favicon.ico">
    <link rel="stylesheet" href="assets/style2.css">
    <script>window.ffllAppPage = true;</script>
</head>
<body>
    <main>
        <a class="back-link" href="index.html">← Back to levels</a>
        <h1 class="page-title">Sonic Blaster</h1>
        <p class="subtitle">Level details, creator info, and preview video</p>
        <div class="card-list">
            <section class="info-card">
                <h2>Level Information</h2>
                <div class="info-row">
                    <div class="info-item"><span>Level ID</span><strong>117017467</strong></div>
                    <div class="info-item"><span>Verifier</span><strong>Angel</strong></div>
                    <div class="info-item"><span>Creator</span><strong>Angel</strong></div>
                    <div class="info-item"><span>Victors</span><strong>Idekan</strong></div>
                </div>
            </section>
            <section class="video-card">
                <h2>Level Video</h2>
                <div class="video-wrap">
                    <iframe width="560" height="315" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <p class="video-note">NO VIDEO AVAILABLE, COMING SOON.</p>
            </section>
        </div>
    </main>
        <script>
        const REDIRECT_URL = "redirect.html";
        const POLL_INTERVAL_MS = 500;
        const allowBack = new URLSearchParams(window.location.search).get('allowBack') === '1';

        function kickUser() {
            window.location.href = REDIRECT_URL;
        }

        function detectDevTools() {
            if (typeof window.devtools === 'object' && window.devtools?.isOpen) {
                return true;
            }

            const widthDiff = Math.abs(window.outerWidth - window.innerWidth);
            const heightDiff = Math.abs(window.outerHeight - window.innerHeight);
            if (widthDiff > 160 || heightDiff > 160) {
                return true;
            }

            let open = false;
            const detector = new Image();
            Object.defineProperty(detector, 'id', {
                get() {
                    open = true;
                    return '';
                }
            });
            console.log('%c', detector);
            return open;
        }

        function checkDevTools() {
            if (allowBack) return;
            if (detectDevTools()) {
                kickUser();
            }
        }

        if (!allowBack) {
            checkDevTools();
            window.addEventListener('resize', checkDevTools);
            window.addEventListener('keydown', event => {
            const key = event.key?.toLowerCase();
            if (key === 'f12' || ((event.ctrlKey || event.metaKey) && event.shiftKey && key === 'i')) {
                kickUser();
            }
        });
        setInterval(checkDevTools, POLL_INTERVAL_MS);
        }
    </script>
</body>
</html>
