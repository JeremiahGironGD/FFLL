<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jace Challenge - FFLL</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #110917;
            --surface: rgba(28, 16, 35, 0.94);
            --border: rgba(255, 255, 255, 0.12);
            --text: #eef3ff;
            --muted: #c3cad9;
            --accent: #b86af2;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, sans-serif;
            background: radial-gradient(circle at top right, rgba(192, 145, 255, 0.16), transparent 28%),
                        radial-gradient(circle at bottom left, rgba(255, 94, 202, 0.12), transparent 24%),
                        linear-gradient(180deg, #120613 0%, #100511 100%);
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }
        main { width: min(760px, 100%); }
        .page-title { margin: 0 0 10px; font-size: clamp(2rem, 3vw, 2.4rem); }
        .subtitle { margin: 0 0 24px; color: var(--muted); }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.4;
        }
        .card-list { display: grid; gap: 20px; }
        .info-card, .video-card {
            background: linear-gradient(135deg, rgba(46, 24, 70, 0.92), rgba(20, 10, 26, 0.96));
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        }
        .info-card h2, .video-card h2 { margin: 0 0 16px; color: #fff; }
        .info-row { display: grid; gap: 12px; }
        .info-item { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); }
        .info-item span { color: var(--muted); }
        .info-item strong { color: #fff; }
        .video-wrap { width: 100%; aspect-ratio: 16 / 9; background: #08040b; border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05); }
        .video-wrap iframe { width: 100%; height: 100%; border: 0; }
        .video-note { margin: 14px 0 0; color: var(--muted); font-size: 0.98rem; }
    </style>
</head>
<body>
    <main>
        <a class="back-link" href="index.html">← Back to levels</a>
        <h1 class="page-title">Jace Challenge</h1>
        <p class="subtitle">Level details, creator info, and preview video</p>
        <div class="card-list">
            <section class="info-card">
                <h2>Level Information</h2>
                <div class="info-row">
                    <div class="info-item"><span>Level ID</span><strong>135913232</strong></div>
                    <div class="info-item"><span>Verifier</span><strong>Idekan</strong></div>
                    <div class="info-item"><span>Creator</span><strong>Idekan</strong></div>
                    <div class="info-item"><span>Victors</span><strong>no2one2noneSs</strong></div>
                </div>
            </section>
            <section class="video-card">
                <h2>Level Video</h2>
                <div class="video-wrap">
                    <iframe width="560" height="315" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    <p class="video-note">NO VIDEO AVAILABLE, COMING SOON.</p>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
